spring.application.name=hospital-inventory

# --- Database connection settings ---
# ${VARIABLE_NAME:default} means: "use the environment variable if it 
# exists, otherwise fall back to the default value after the colon."
# This is what lets the EXACT SAME file work both locally (using our 
# Termux Postgres) and in production (using real Supabase credentials 
# injected as environment variables) - nothing needs to change 
# depending on where it's running
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hospital_inventory}
spring.datasource.username=${DATABASE_USERNAME:u0_a394}
spring.datasource.password=${DATABASE_PASSWORD:}

# --- JPA / Hibernate settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Redis cache settings ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Upstash (and most cloud Redis providers) require an encrypted 
# connection - locally this stays false since Termux's Redis has no 
# encryption at all
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.cache.redis.time-to-live=60000

# --- JWT secret ---
# We'll use this in JwtUtil next, replacing the hardcoded string
app.jwt.secret=${JWT_SECRET:ThisIsATemporaryDevelopmentSecretKeyChangeThisLater123456}
