spring.application.name=hospital-inventory

# --- Database connection settings ---
# The address of our PostgreSQL database. "localhost" means "this same device",
# 5432 is PostgreSQL's default port, and "hospital_inventory" is the database name we created
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_inventory

# Termux's PostgreSQL, by default, uses your Termux username with no password
spring.datasource.username=u0_a394
spring.datasource.password=

# --- JPA / Hibernate settings ---
# "update" means: automatically create/update database tables based on our 
# Java classes (User, Product, StockMovement, etc.) as we write them.
# We'll switch this to something safer once the schema is stable.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs, in the terminal — great for learning 
# and debugging, since you can see exactly what's happening behind the scenes
spring.jpa.show-sql=true

# Tells Hibernate we're specifically using PostgreSQL, so it generates 
# correct SQL syntax for it
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Redis cache settings ---
# Redis runs locally on the default port
spring.data.redis.host=localhost
spring.data.redis.port=6379

# How long a cached value stays valid before automatically expiring - 
# a safety net in case we ever miss clearing it manually somewhere
spring.cache.redis.time-to-live=60000
